<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Tienda Digital Cúcuta - Vitrina Local</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-surface text-on-surface font-body antialiased">
    <header class="fixed top-0 left-0 w-full z-50 bg-slate-50/80 backdrop-blur-2xl">
        <nav class="flex justify-between items-center w-full px-6 lg:px-12 py-4 max-w-screen-2xl mx-auto">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-emerald-600">storefront</span>
                <span class="text-2xl font-bold tracking-tighter text-slate-900 font-headline">Tienda Digital
                    Cúcuta</span>
            </div>
            <div class="hidden md:flex items-center gap-8">
                <a class="text-emerald-700 font-bold border-b-2 border-emerald-500 pb-1" href="#">Inicio</a>
                <div class="relative flex items-center">
                    <a id="login-btn" href="login.html" class="inline-block bg-primary text-on-primary px-6 py-2 rounded-lg font-bold emerald-pulse cursor-pointer select-none">
                        Iniciar Sesión
                    </a>
                    
                    <!-- Menú Desplegable -->
                    <div id="user-dropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 hidden opacity-0 transition-opacity duration-200 z-50 overflow-hidden">
                        <button onclick="logout()" class="w-full text-left px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 hover:text-emerald-600 font-bold flex items-center gap-2 transition-colors">
                            <span class="material-symbols-outlined text-lg">logout</span>
                            Cerrar Sesión
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="pt-24 pb-16">
        <section class="relative px-6 lg:px-12 py-20 flex flex-col items-center text-center overflow-hidden">
            <h1 class="text-5xl lg:text-7xl font-extrabold tracking-tighter mb-6 leading-tight">
                Descubre el Corazón <br />Comercial de <span class="text-primary">Cúcuta</span>
            </h1>

            <div
                class="w-full max-w-4xl flex flex-col md:flex-row gap-4 items-stretch p-2 bg-white rounded-xl shadow-lg">
                <div class="flex-grow flex items-center px-4 gap-3 bg-slate-50 rounded-lg">
                    <span class="material-symbols-outlined text-slate-400">search</span>
                    <input id="search-input" class="w-full py-4 bg-transparent border-none focus:ring-0"
                        placeholder="Buscar productos en Pueblo Nuevo..." type="text" />
                </div>
                <button class="emerald-pulse text-white px-10 py-4 rounded-lg font-bold">Buscar</button>
            </div>
        </section>

        <section class="max-w-screen-2xl mx-auto px-6 lg:px-12 py-16">
            <h2 class="text-3xl font-extrabold tracking-tighter uppercase mb-12">VITRINAS DESTACADAS</h2>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <p class="text-slate-500">Cargando productos locales...</p>
            </div>
        </section>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
